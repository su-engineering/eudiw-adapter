<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="eudiw-adapter: verify EUDI Wallet credentials, return only the claims you asked for">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)" opacity="0.6"/>
  <circle cx="930" cy="200" r="260" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">eudiw-adapter</text>
    <rect x="74" y="172" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="228" font-size="24" fill="#cbd5e1">Accept EU Digital Identity Wallet credentials.</text>
    <text x="72" y="262" font-size="24" fill="#cbd5e1">Get back only the claims you asked for.</text>
    <g font-size="15" font-weight="600">
      <rect x="72" y="296" width="118" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="131" y="317" text-anchor="middle" fill="#7dd3fc">OpenID4VP 1.0</text>
      <rect x="200" y="296" width="92" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="246" y="317" text-anchor="middle" fill="#a5b4fc">HAIP 1.0</text>
      <rect x="302" y="296" width="106" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="355" y="317" text-anchor="middle" fill="#7dd3fc">SD-JWT VC</text>
      <rect x="418" y="296" width="150" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="493" y="317" text-anchor="middle" fill="#a5b4fc">ETSI trusted lists</text>
    </g>

    <!-- wallet -->
    <g transform="translate(700 120)">
      <rect width="96" height="160" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <rect x="12" y="22" width="72" height="44" rx="8" fill="url(#accent)" opacity="0.9"/>
      <rect x="12" y="76" width="72" height="8" rx="4" fill="#334155"/>
      <rect x="12" y="92" width="52" height="8" rx="4" fill="#334155"/>
      <rect x="12" y="108" width="62" height="8" rx="4" fill="#334155"/>
      <text x="48" y="188" text-anchor="middle" font-size="15" fill="#94a3b8">Wallet</text>
    </g>

    <!-- adapter -->
    <g transform="translate(890 130)">
      <path d="M70 0L140 26V76C140 118 110 142 70 158C30 142 0 118 0 76V26Z" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
      <path d="M44 80L63 99L98 62" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="182" text-anchor="middle" font-size="15" fill="#94a3b8">eudiw-adapter</text>
    </g>

    <!-- app -->
    <g transform="translate(1104 132)">
      <rect width="120" height="96" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <rect width="120" height="22" rx="12" fill="#1e293b"/>
      <circle cx="14" cy="11" r="4" fill="#f87171"/><circle cx="28" cy="11" r="4" fill="#fbbf24"/><circle cx="42" cy="11" r="4" fill="#34d399"/>
      <text x="60" y="58" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#86efac">age_over_18</text>
      <text x="60" y="76" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#86efac">true</text>
      <text x="60" y="122" text-anchor="middle" font-size="15" fill="#94a3b8">Your app</text>
    </g>

    <path d="M806 200H876" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <path d="M1040 190H1094" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
