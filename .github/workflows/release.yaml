name: Release

# Pushing a tag vX.Y.Z publishes that version: the signed multi-arch image with SBOM and provenance, the signed Helm
# chart, the npm package of the web component with provenance, and a GitHub release with notes from CHANGELOG.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/su-engineering/eudiw-adapter
  CHARTS: oci://ghcr.io/su-engineering/charts

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      - name: The tag, Maven, the chart, the npm package and the changelog name the same version
        id: check
        run: |
          version=${GITHUB_REF_NAME#v}
          maven=$(./mvnw -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          chart=$(sed -n 's/^version: *//p' deploy/helm/eudiw-adapter/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/eudiw-adapter/Chart.yaml)
          npm=$(jq -r .version clients/web/package.json)
          echo "tag $version, maven $maven, chart $chart, appVersion $app, npm $npm"
          for v in "$maven" "$chart" "$app" "$npm"; do [ "$v" = "$version" ] || { echo "version mismatch"; exit 1; }; done
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: [ci, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 and linux/arm64 with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: adapter-verifier-service/src/main/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ needs.versions.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=eudiw-adapter
            org.opencontainers.image.description=Self-hosted EUDI Wallet verifier (OpenID4VP, HAIP, SD-JWT VC) for relying parties
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=su.engineering
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: SPDX SBOM for the release page
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: eudiw-adapter-${{ needs.versions.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: eudiw-adapter-${{ needs.versions.outputs.version }}.spdx.json

  chart:
    needs: [versions, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package, push and sign the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/eudiw-adapter
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(helm push "eudiw-adapter-${{ needs.versions.outputs.version }}.tgz" "$CHARTS" 2>&1 \
            | tee /dev/stderr | sed -n 's/^Digest: *//p')
          [ -n "$digest" ] || { echo "no chart digest"; exit 1; }
          cosign sign --yes "${CHARTS#oci://}/eudiw-adapter@$digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: eudiw-adapter-${{ needs.versions.outputs.version }}.tgz

  github-release:
    needs: [versions, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Only the release assets: the run also holds CI's test reports.
        with:
          pattern: '{chart,sbom}'
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.versions.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ### Artifacts

          - Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`), linux/amd64 and linux/arm64, signed with cosign, SBOM and provenance attached
          - Chart: \`$CHARTS/eudiw-adapter --version $VERSION\`, signed with cosign; also attached below
          - Web component: [\`@su-engineering/eudiw-request@$VERSION\`](https://www.npmjs.com/package/@su-engineering/eudiw-request/v/$VERSION), published with provenance

          Verify the image: see [docs/kubernetes.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/kubernetes.md#image-and-chart).
          NOTES
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md assets/*

  npm:
    needs: [ci, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) allows staging only: a maintainer approves the staged version with
      # 2FA (npm stage approve, or on npmjs.com) before it becomes installable. See docs/releasing.md.
      - name: Stage @su-engineering/eudiw-request with provenance
        working-directory: clients/web
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          npm install --global npm@11
          if npm view "@su-engineering/eudiw-request@$VERSION" version > /dev/null 2>&1; then
            echo "already published"; exit 0
          fi
          cp ../../LICENSE ../../NOTICE .
          npm test
          npm stage publish --provenance --access public
