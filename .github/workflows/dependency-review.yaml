name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependency review needs the repository's dependency graph (Settings, Code security). Until it is on, this
      # job says so and passes; the OSV job in ci.yaml still gates the resolved Maven dependencies.
      - name: Dependency graph enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dependency graph is off for this repository; dependency review skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Fails a pull request that adds a dependency with a known advisory of moderate severity or worse, or a
      # licence incompatible with Apache-2.0 distribution. The OSV job in ci.yaml covers the resolved Maven tree.
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
