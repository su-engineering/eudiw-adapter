name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the whole of CI on the tagged commit before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      # Each job keeps its own Maven cache: with setup-java's shared key, the first job to finish saved only
      # what it needed and the others downloaded the rest from Maven Central, which answers bursts with 429.
      # .mvn/maven.config makes Maven retry those.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      # osv-scanner cannot resolve this reactor's own snapshot modules from pom.xml, so it reads the resolved
      # runtime dependencies from a CycloneDX SBOM. Accepted advisories live in osv-scanner.toml, with an expiry.
      - name: Resolve runtime dependencies into an SBOM
        run: >-
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom
      - name: Known vulnerabilities in runtime dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=target/bom.json

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      # While Maven compiles: the images the tests start (PostgreSQL through Quarkus Dev Services, the eudi-dev
      # wallet, Vault, local-kms). A failed pull here only means the tests pull it themselves.
      - name: Pull test containers in the background
        run: |
          for image in postgres:18 testcontainers/ryuk:0.14.0 ghcr.io/eudi-dev/eudi-dev:v3.8.0 \
            hashicorp/vault:1.21.1@sha256:f4e2687b72858a9e2160c344c9fa1ef74c07f21a89a8c00534ab64d3f187b927 \
            nsmithuk/local-kms:latest@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3; do
            (docker pull -q "$image" > /dev/null 2>&1 &)
          done
      - name: Install SoftHSM for the PKCS#11 signer tests
        # Try the runner's package lists first; refresh only the Ubuntu archive (not every vendor repo) if that fails.
        run: |
          install() { sudo apt-get install -y -q --no-install-recommends softhsm2; }
          install || {
            mkdir -p /tmp/apt-ubuntu && cp /etc/apt/sources.list.d/ubuntu.sources /tmp/apt-ubuntu/
            sudo apt-get update -q -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/apt-ubuntu && install
          }
      - name: Check format, dependency rules and run tests
        run: ./mvnw -B -ntp verify -Deudiw.require-pkcs11=true
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      - name: Pull the demo's images in the background
        run: |
          (docker compose -f deploy/compose/docker-compose.yml --profile wallet --profile waltid --profile dc-api \
            pull -q --ignore-buildable > /dev/null 2>&1 &)
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      - name: Run the Compose demo end to end
        run: ./deploy/compose/demo.sh
      - name: Second wallet (walt.id Wallet API 2) against the demo
        run: ./deploy/compose/waltid/run.sh
      - name: Digital Credentials API in Chromium (eudi-dev extension and wallet server)
        run: ./deploy/compose/dc-api/run.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Node and Python examples against the demo
        run: ./examples/e2e.sh
      - name: Example page rendered in Chromium (QR decoded from the screen, font, verified state)
        env:
          OUT_DIR: ${{ runner.temp }}/render
        run: ./examples/render/check.sh
      - name: Rendered screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-example-page
          path: ${{ runner.temp }}/render/*.png
          if-no-files-found: ignore
      - name: Service logs
        if: always()
        run: |
          docker compose -f deploy/compose/docker-compose.yml logs adapter | tail -200
          docker compose -f deploy/compose/docker-compose.yml --profile waltid logs waltid-wallet | tail -100
          docker compose -f deploy/compose/docker-compose.yml --profile dc-api logs dc-wallet | tail -100

  # The web component and the examples' own tests: no Java, no Compose.
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install zbar to decode the rendered QR codes
        # Try the runner's package lists first; refresh only the Ubuntu archive (not every vendor repo) if that fails.
        run: |
          install() { sudo apt-get install -y -q --no-install-recommends zbar-tools; }
          install || {
            mkdir -p /tmp/apt-ubuntu && cp /etc/apt/sources.list.d/ubuntu.sources /tmp/apt-ubuntu/
            sudo apt-get update -q -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/apt-ubuntu && install
          }
      - name: Web component and example unit tests
        env:
          REQUIRE_ZBAR: '1'
        run: |
          node --test clients/web/test/*.test.mjs examples/node/test/*.test.mjs
          (cd examples/python && python3 -m unittest -v test_webhook)

  # The one-command demo for people who do not clone: the released image and the files run.sh downloads, here
  # taken from this checkout through a file:// URL.
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Piped into sh, as the README shows: the script must not lose the rest of itself to a command reading stdin.
      - name: Run the quickstart against this checkout
        env:
          EUDIW_BASE_URL: file://${{ github.workspace }}
          EUDIW_QUICKSTART_DIR: ${{ runner.temp }}/quickstart
        run: |
          set -o pipefail
          curl -fsSL "file://${{ github.workspace }}/deploy/quickstart/run.sh" | sh | tee "${{ runner.temp }}/quickstart.log"
          grep -q '^Done\.' "${{ runner.temp }}/quickstart.log"
      - name: Service logs
        if: failure()
        working-directory: ${{ runner.temp }}/quickstart
        run: docker compose logs adapter | tail -200

  oidf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      - name: Pull the suite's images in the background
        run: |
          (docker compose -f interop/oidf/suite-compose.yml pull -q > /dev/null 2>&1 &)
          (docker pull -q postgres:16.10-alpine > /dev/null 2>&1 &)
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      # The OpenID Foundation suite plays the wallet and the issuer. ci.sh fails when a module ends differently
      # from interop/oidf/expected.json or the suite logs a failure or warning. Every module ends in REVIEW;
      # this is not certification.
      - name: OpenID Foundation OID4VP 1.0 Final + HAIP verifier test plan
        env:
          OUT_DIR: ${{ runner.temp }}/oidf
        run: ./interop/oidf/ci.sh
      - name: Suite logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidf-conformance-logs
          path: ${{ runner.temp }}/oidf/
          retention-days: 90
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ github.job }}-
      - name: Tools on the runner image
        run: kind version && helm version --short && kubectl version --client
      - name: Lint the chart
        run: >-
          helm lint deploy/helm/eudiw-adapter --strict
          --set image.repository=eudiw-adapter --set image.tag=ci --set publicBaseUrl=https://adapter.example
          --set database.url=jdbc:postgresql://postgres:5432/eudiw --set database.existingSecret=db
          --set dataKey.existingSecret=key --set config.existingSecret=config
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      - name: Install the chart on kind under the restricted Pod Security Standard
        run: ./deploy/helm/smoke-test.sh
      - name: Pod logs
        if: failure()
        run: kubectl -n eudiw logs -l app.kubernetes.io/name=eudiw-adapter --tail=200 || true
