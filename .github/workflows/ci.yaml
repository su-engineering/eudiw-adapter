name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the whole of CI on the tagged commit before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # osv-scanner cannot resolve this reactor's own snapshot modules from pom.xml, so it reads the resolved
      # runtime dependencies from a CycloneDX SBOM. To accept an advisory, add an osv-scanner.toml with an
      # [[IgnoredVulns]] entry that has a reason and an ignoreUntil date, and pass --config=osv-scanner.toml.
      - name: Resolve runtime dependencies into an SBOM
        run: >-
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom
      - name: Known vulnerabilities in runtime dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=target/bom.json

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install SoftHSM for the PKCS#11 signer tests
        run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2
      - name: Check format, dependency rules and run tests
        run: ./mvnw -B -ntp clean verify -Deudiw.require-pkcs11=true
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  demo:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      - name: Run the Compose demo end to end
        run: ./deploy/compose/demo.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Web component and example unit tests
        env:
          REQUIRE_ZBAR: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zbar-tools
          node --test clients/web/test/*.test.mjs examples/node/test/*.test.mjs
          (cd examples/python && python3 -m unittest -v test_webhook)
      - name: Node and Python examples against the demo
        run: ./examples/e2e.sh
      - name: Example page rendered in Chromium (QR decoded from the screen, font, verified state)
        env:
          OUT_DIR: ${{ runner.temp }}/render
        run: ./examples/render/check.sh
      - name: Rendered screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-example-page
          path: ${{ runner.temp }}/render/*.png
          if-no-files-found: ignore
      - name: Service logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs adapter | tail -200

  helm:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tools on the runner image
        run: kind version && helm version --short && kubectl version --client
      - name: Lint the chart
        run: >-
          helm lint deploy/helm/eudiw-adapter --strict
          --set image.repository=eudiw-adapter --set image.tag=ci --set publicBaseUrl=https://adapter.example
          --set database.url=jdbc:postgresql://postgres:5432/eudiw --set database.existingSecret=db
          --set dataKey.existingSecret=key --set config.existingSecret=config
      - name: Build the service
        run: ./mvnw -B -ntp -pl adapter-verifier-service -am package -DskipTests
      - name: Install the chart on kind under the restricted Pod Security Standard
        run: ./deploy/helm/smoke-test.sh
      - name: Pod logs
        if: failure()
        run: kubectl -n eudiw logs -l app.kubernetes.io/name=eudiw-adapter --tail=200 || true
