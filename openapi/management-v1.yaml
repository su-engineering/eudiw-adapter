openapi: 3.1.0
info:
  title: eudiw-adapter management API
  version: 0.1.0
  summary: Start credential verifications and retrieve minimized results.
  description: |
    Application-facing API of the eudiw-adapter verifier service. Every operation requires an OAuth 2.0 access
    token (client credentials) whose client is registered in the adapter configuration. The tenant is always taken
    from the token's client, never from the request.

    The wallet-facing OpenID4VP endpoints (`/oid4vp/requests/{handle}`, `/oid4vp/responses`) follow
    OpenID for Verifiable Presentations 1.0 and HAIP 1.0 and are not part of this API.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://adapter.example
security:
  - bearer: []
paths:
  /v1/verification-sessions:
    post:
      operationId: createVerificationSession
      summary: Start a verification session
      description: |
        Creates a session for a policy granted to the calling client. The request the wallet receives is built
        from the policy alone; callers cannot add claims. Requires scope `verification:create`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key, 8 to 128 characters of `[A-Za-z0-9._-]`. Retrying with the same key
            and body returns the same session; the same key with a different body returns 422.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session created, or the existing session for this idempotency key
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          description: The client created more sessions this minute than its `rate_limit` allows (default 300,
            counted across all nodes). Code `rate_limited`.
          headers:
            Retry-After:
              description: Seconds until the next one-minute window starts.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/verification-sessions/{id}:
    get:
      operationId: getVerificationSession
      summary: Get the session status
      description: Requires scope `verification:read`. Sessions of other clients or tenants return 404.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/verification-sessions/{id}/events:
    get:
      operationId: streamVerificationSessionEvents
      summary: Follow the session status as Server-Sent Events
      description: |
        Requires scope `verification:read`. Sessions of other clients or tenants return 404. Each event is named
        `status` and its data is the same JSON as the status call: first the current status, then one event per
        change. The server closes the stream once the status is anything but `pending`, when the access token
        expires, or when the client is removed from the configuration. A comment line is sent every 15 seconds
        without a change. Events never carry claims; fetch the result once with the result call. See ADR-013.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: |
            An event stream. Each event's `data` is a `Session` object, for example:

                event: status
                id: 1
                data: {"id":"vrs_...","status":"pending",...}
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          description: Too many open event streams on this node or for this client. Poll instead, or retry after `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/verification-sessions/{id}/result:
    get:
      operationId: getVerificationResult
      summary: Retrieve the verified result once
      description: |
        Returns the minimized result of a verified session and deletes it; a second call returns 404. Same-device
        sessions require the `response_code` the wallet's redirect delivered to the client's completion URI.
        Requires scope `verification:result`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: response_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The minimized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/verification-sessions/{id}/cancel:
    post:
      operationId: cancelVerificationSession
      summary: Cancel a pending session
      description: Idempotent. A session that already reached a terminal state is unchanged. Requires scope
        `verification:cancel`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session after cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Problem'
webhooks:
  verificationSessionEnded:
    post:
      operationId: verificationSessionEnded
      summary: A session of the calling client ended
      description: |
        Sent to the client's configured webhook URL when one of its sessions becomes `verified`, `rejected`,
        `denied` or `expired`. Cancelled sessions are not notified, since the client cancelled them. The body never
        contains claims: fetch the result with the session id.

        Signed as Standard Webhooks specify: `webhook-signature` is `v1,` followed by the base64 HMAC-SHA256 of
        `webhook-id`, `.`, `webhook-timestamp`, `.` and the exact request body, keyed with the decoded `whsec_`
        secret. During a secret rotation it holds two space-separated signatures. Reject a timestamp far from your
        clock and process each `webhook-id` once. Any 2xx response acknowledges; other responses are retried with
        backoff for about a day, except `410 Gone`, which stops delivery. Redirects are not followed.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema: { type: string, pattern: '^msg_[0-9a-f]{32}$' }
        - name: webhook-timestamp
          in: header
          required: true
          schema: { type: string, description: Unix time of this attempt in seconds }
        - name: webhook-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationSessionEvent'
      responses:
        '200':
          description: Acknowledged. Any 2xx status acknowledges.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 access token with `azp` or `client_id` naming a registered client and a `scope` claim.
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^vrs_[A-Za-z0-9_-]{43}$'
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    VerificationSessionEvent:
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          type: string
          enum:
            - verification_session.verified
            - verification_session.rejected
            - verification_session.denied
            - verification_session.expired
        timestamp:
          type: string
          format: date-time
          description: When the session ended.
        data:
          type: object
          required: [id, status, policy_id]
          properties:
            id: { type: string }
            status: { type: string, enum: [verified, rejected, denied, expired] }
            policy_id: { type: string }
            reason: { type: string, description: Coarse failure code, as in the session resource. }
            client_reference: { type: string }
    CreateSession:
      type: object
      required: [policy_id]
      additionalProperties: false
      properties:
        policy_id:
          type: string
          description: A policy granted to the calling client.
        mode:
          type: string
          enum: [cross_device, same_device]
          default: cross_device
          description: |
            `same_device` sends the wallet back to the client's registered completion URI with a one-time
            `response_code`, which result retrieval requires (protects against session fixation, OpenID4VP 1.0
            section 14.2). `cross_device` (QR code) cannot detect a relayed request.
        client_reference:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
          description: Correlation value for the caller. Not used for identity.
    Session:
      type: object
      required: [id, status, policy_id, mode, created_at, expires_at, result_available]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, verified, rejected, denied, expired, cancelled, consumed]
          description: |
            `verified`: the policy is satisfied and a result can be retrieved once. `rejected`: a cryptographic,
            trust, status or policy check failed. `denied`: the user or wallet declined. `consumed`: the result was
            retrieved.
        policy_id:
          type: string
        mode:
          type: string
        client_reference:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        reason:
          type: string
          description: Coarse failure code when rejected, for example `credential_revoked` or `certificate_untrusted`.
        result_available:
          type: boolean
    CreatedSession:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [wallet_launch, poll_url, events_url]
          properties:
            wallet_launch:
              type: object
              required: [request_uri, launch_uri, qr_payload]
              properties:
                request_uri:
                  type: string
                  format: uri
                launch_uri:
                  type: string
                  description: Wallet invocation URI (for example `openid4vp://...`).
                qr_payload:
                  type: string
                  description: The same value as `launch_uri`, for rendering as a QR code.
            poll_url:
              type: string
            events_url:
              type: string
              description: Path of the Server-Sent Events stream of this session's status.
    Result:
      type: object
      required: [id, status, policy_id, verified_at, claims, credential_evidence]
      properties:
        id:
          type: string
        status:
          type: string
          const: verified
        policy_id:
          type: string
        verified_at:
          type: string
          format: date-time
        claims:
          type: object
          description: Only the claims the policy's output maps, nothing else the wallet disclosed.
          additionalProperties: true
        credential_evidence:
          type: array
          items:
            type: object
            required: [format, credential_type, issuer]
            properties:
              format:
                type: string
              credential_type:
                type: string
              issuer:
                type: string
    Problem:
      type: object
      required: [status, code, correlation_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlation_id:
          type: string
