# Known advisories accepted for now, each with a reason and an expiry. CI fails again once ignoreUntil passes.

[[IgnoredVulns]]
id = "GHSA-ccrj-gw8r-854m"
ignoreUntil = 2027-01-31
reason = """opentelemetry-api 1.62.0 (managed by Quarkus 3.39.5) parses tracestate with a regex that is quadratic on
runs of spaces or tabs. The disabled SDK keeps the W3C propagators, so treat it as reachable with tracing off, the
default. Mitigated in code: quarkus.otel.propagators uses tracecontext-bounded (BoundedTraceContextPropagator), which
drops a tracestate longer than 512 characters before parsing, the workaround the advisory names. The fixed 1.67.0
cannot be forced under Quarkus 3.39: with the 1.67.0 API, Quarkus' instrumentation 2.28.1 fails with
NoClassDefFoundError (InstrumentationUtil), and with instrumentation 2.33.1 as well, its OTLP exporter fails at
startup with NoSuchMethodError (ExporterBuilderUtil.validateEndpoint). Take 1.67.0 with the first Quarkus release
that ships it, then delete BoundedTraceContextPropagator."""
