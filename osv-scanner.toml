# Known advisories accepted for now, each with a reason and an expiry. CI fails again once ignoreUntil passes.

[[IgnoredVulns]]
id = "GHSA-ccrj-gw8r-854m"
ignoreUntil = 2027-01-31
reason = """opentelemetry-api 1.62.0, tracestate parsing CPU. Comes with Quarkus 3.39.5; reachable only with
tracing enabled (quarkus.otel.sdk.disabled=true by default). Take the fixed version (1.67.0) with the next Quarkus
release that ships it. Overriding the OpenTelemetry BOM to 1.67.0 under Quarkus 3.39.5 was tried and breaks
tracing: the Quarkus instrumentation (2.28.1) calls io.opentelemetry.api.internal.InstrumentationUtil, which
1.67.0 no longer has, so every traced request fails with NoClassDefFoundError."""
