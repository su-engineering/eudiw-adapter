# Local demo of the eudiw-adapter verifier service. Synthetic keys and credentials only; not a production setup.
# Run ./demo.sh from this directory.
name: eudiw-adapter-demo

services:
  keygen:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "/generate-keys.sh", "/keys"]
    volumes:
      - ./generate-keys.sh:/generate-keys.sh:ro
      - keys:/keys

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: eudiw
      POSTGRES_USER: eudiw
      POSTGRES_PASSWORD: demo-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudiw -d eudiw"]
      interval: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: demo-only-admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./config/keycloak-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
      # A realm whose login offers the adapter as an OpenID Connect identity provider (oidc/, ADR-018)
      - ./config/keycloak-shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"

  # Creates a SoftHSM token and generates the verifier's request-signing key inside it.
  hsm-init:
    image: eudiw-adapter-demo:local
    build:
      context: ../..
      dockerfile: adapter-verifier-service/src/main/docker/Dockerfile
      args:
        EXTRA_PACKAGES: softhsm2 opensc openssl
    user: "0"
    entrypoint: ["/bin/sh", "/hsm-init.sh"]
    depends_on:
      keygen:
        condition: service_completed_successfully
    volumes:
      - ./hsm-init.sh:/hsm-init.sh:ro
      - keys:/keys:ro
      - hsm:/hsm

  adapter:
    image: eudiw-adapter-demo:local
    build:
      context: ../..
      dockerfile: adapter-verifier-service/src/main/docker/Dockerfile
      args:
        EXTRA_PACKAGES: softhsm2 opensc openssl
    depends_on:
      keygen:
        condition: service_completed_successfully
      hsm-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      EUDIW_CONFIG_FILE: /config/tenants.json
      EUDIW_PUBLIC_BASE_URL: http://adapter:8080
      EUDIW_PRODUCTION: "false"
      EUDIW_DB_URL: jdbc:postgresql://postgres:5432/eudiw
      EUDIW_DB_USER: eudiw
      EUDIW_DB_PASSWORD: demo-only-password
      EUDIW_OIDC_ISSUER: http://keycloak:8080/realms/demo
      EUDIW_OIDC_AUDIENCE: eudiw-adapter
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8081/realms/demo
      QUARKUS_OIDC_CONNECTION_DELAY: 90s
      SOFTHSM2_CONF: /hsm/softhsm2.conf
    # Webhooks go to an example backend on the host (examples/README.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - EUDIW_DATA_KEY=$$(cat /keys/data-key) exec java -XX:MaxRAMPercentage=75 -jar /app/quarkus-run.jar
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config/tenants.json:/config/tenants.json:ro
      - keys:/keys:ro
      - hsm:/hsm
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"

  wallet:
    image: ghcr.io/eudi-dev/eudi-dev:v3.8.0
    profiles: ["wallet"]
    entrypoint: ["/bin/sh", "/wallet.sh"]
    volumes:
      - ./wallet.sh:/wallet.sh:ro
      - keys:/keys:ro

  # A second, independent wallet: walt.id Wallet API 2, driven over its HTTP API by waltid-holder (waltid/).
  waltid-wallet:
    image: waltid/wallet-api2:1.2.1@sha256:7937cfe2450e5521e272615179baef66f805459df391f2321b2f20ad92468614
    profiles: ["waltid"]
    entrypoint: ["/bin/sh", "/waltid/start.sh"]
    depends_on:
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:7006/wallet"]
      interval: 2s
      retries: 60
    volumes:
      - ./waltid:/waltid:ro
      - keys:/keys:ro

  waltid-holder:
    image: node:22.21.1-alpine@sha256:0340fa682d72068edf603c305bfbc10e23219fb0e40df58d9ea4d6f33a9798bf
    profiles: ["waltid"]
    entrypoint: ["node", "/waltid/holder.mjs"]
    depends_on:
      waltid-wallet:
        condition: service_healthy
    volumes:
      - ./waltid:/waltid:ro
      - keys:/keys:ro

  # The W3C Digital Credentials API in a real browser: eudi-dev's wallet server and its browser extension answer
  # navigator.credentials.get() on a relying-party page that runs in Chromium (dc-api/).
  dc-wallet:
    image: ghcr.io/eudi-dev/eudi-dev:v3.8.0
    profiles: ["dc-api"]
    # root, to write the extension into the shared volume
    user: "0"
    entrypoint: ["/bin/sh", "/dc-api/wallet.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /ext/ready || exit 1"]
      interval: 2s
      retries: 60
    volumes:
      - ./dc-api:/dc-api:ro
      - keys:/keys:ro
      - dc-extension:/ext

  dc-browser:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    profiles: ["dc-api"]
    working_dir: /work
    entrypoint:
      - /bin/sh
      - -c
      - npm init -y > /dev/null && npm i -s playwright@1.56.1 > /dev/null 2>&1 && cp /dc-api/*.mjs . && node "$${SCRIPT:-check.mjs}"
    depends_on:
      dc-wallet:
        condition: service_healthy
    volumes:
      - ./dc-api:/dc-api:ro
      - dc-extension:/ext:ro
      # kit.mjs serves the Node example and the <eudiw-request> component from here
      - ../../examples:/repo/examples:ro
      - ../../clients:/repo/clients:ro

  # Wallet login through Keycloak (oidc/): Chromium logs in to the shop realm's account console with the adapter as
  # its identity provider; run.sh hands the launch URI the login page shows to the wallet service.
  oidc-browser:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    profiles: ["oidc"]
    working_dir: /work
    entrypoint:
      - /bin/sh
      - -c
      - npm init -y > /dev/null && npm i -s playwright@1.56.1 > /dev/null 2>&1 && cp /oidc/*.mjs . && node check.mjs
    volumes:
      - ./oidc:/oidc:ro
      - ./oidc/out:/out

volumes:
  keys:
  hsm:
  dc-extension:
