# No image is published yet. Build it from this repository and set image.repository and image.tag.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

# Public HTTPS origin wallets reach, for example https://adapter.example (EUDIW_PUBLIC_BASE_URL).
publicBaseUrl: ""
# true refuses HTTP public URLs, development egress settings and status_policy ignore.
production: true

oidc:
  # Issuer of the client-credentials access tokens your backends present.
  issuer: ""
  # Audience those tokens must carry.
  audience: ""

database:
  # JDBC URL of PostgreSQL 16 or later, for example jdbc:postgresql://postgres:5432/eudiw
  url: ""
  # Secret with keys "username" and "password".
  existingSecret: ""

# Secret with key "data-key": 32 random bytes, base64 (openssl rand -base64 32).
dataKey:
  existingSecret: ""

# Secret mounted read-only at /config. It must contain tenants.json and every file tenants.json references,
# with paths relative to /config (keys, certificate chains, trust anchors, webhook secrets).
config:
  existingSecret: ""

egress:
  allowPrivateAddresses: false
  allowHttp: false

trustedLists:
  refreshInterval: 1h

webhooks:
  interval: 5s

# The service rereads the config Secret when it changes (Kubernetes updates mounted Secrets in place) and keeps
# the running configuration if the new one does not validate. "off" disables the check.
configReload:
  interval: 30s

metrics:
  # Prometheus metrics at :9000/metrics. A ServiceMonitor (Prometheus Operator) and a ClusterIP Service for the
  # management port are created only when enabled.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

tracing:
  # OpenTelemetry traces over OTLP. Request handles and query strings are removed from spans.
  enabled: false
  # For example http://otel-collector.observability:4317
  endpoint: ""

# Extra environment variables, for example Quarkus settings.
extraEnv: []
# Extra volumes and mounts, for example a PKCS#11 library and its configuration.
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# Ingress to the public port from anywhere; the management port (9000) from this namespace and from the
# namespaces selected here (for example the one Prometheus runs in).
networkPolicy:
  enabled: true
  # A namespace label selector, for example {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  managementNamespaceSelector: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
