{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eudiw-adapter.fullname" . }}
  labels:
    {{- include "eudiw-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eudiw-adapter.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.managementNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: 9000
{{- end }}
