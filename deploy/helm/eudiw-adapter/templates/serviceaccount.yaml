apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eudiw-adapter.fullname" . }}
  labels:
    {{- include "eudiw-adapter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
