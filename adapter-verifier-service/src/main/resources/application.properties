# eudiw-adapter verifier service

# Deployment settings (environment variables in production)
eudiw.config-file=${EUDIW_CONFIG_FILE}
eudiw.public-base-url=${EUDIW_PUBLIC_BASE_URL}
eudiw.data-key=${EUDIW_DATA_KEY}
eudiw.previous-data-keys=${EUDIW_PREVIOUS_DATA_KEYS:}
eudiw.production=${EUDIW_PRODUCTION:true}
eudiw.egress.allow-private-addresses=${EUDIW_EGRESS_ALLOW_PRIVATE_ADDRESSES:false}
eudiw.egress.allow-http=${EUDIW_EGRESS_ALLOW_HTTP:false}
eudiw.egress.allowed-hosts=${EUDIW_EGRESS_ALLOWED_HOSTS:}
eudiw.egress.proxy=${EUDIW_EGRESS_PROXY:}
eudiw.trusted-lists.refresh-interval=${EUDIW_TRUSTED_LISTS_REFRESH_INTERVAL:1h}
eudiw.webhook.interval=${EUDIW_WEBHOOK_INTERVAL:5s}
eudiw.wallet.requests-per-minute=${EUDIW_WALLET_REQUESTS_PER_MINUTE:0}
eudiw.config.reload-interval=${EUDIW_CONFIG_RELOAD_INTERVAL:30s}

# Database
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${EUDIW_DB_URL:}
%prod.quarkus.datasource.username=${EUDIW_DB_USER:}
%prod.quarkus.datasource.password=${EUDIW_DB_PASSWORD:}
quarkus.flyway.migrate-at-start=true

# Management API authentication: OAuth 2.0 bearer tokens (client credentials)
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${EUDIW_OIDC_ISSUER:}
quarkus.oidc.token.audience=${EUDIW_OIDC_AUDIENCE:}
quarkus.oidc.discovery-enabled=true

# Request bodies with properties the API does not define are refused, as the OpenAPI schema states
# (additionalProperties: false), rather than silently ignored.
quarkus.jackson.fail-on-unknown-properties=true

# Health on the separate management interface, not on the public port. It listens on every interface so that
# Kubernetes probes and Prometheus reach it; outside Kubernetes set EUDIW_MANAGEMENT_HOST=127.0.0.1 or firewall it.
quarkus.management.enabled=true
quarkus.management.port=9000
%prod.quarkus.management.host=${EUDIW_MANAGEMENT_HOST:0.0.0.0}
quarkus.smallrye-health.root-path=/health

# Prometheus metrics on the management interface only. Only the service's own meters, JVM, process and the
# connection pool are recorded; HTTP binders are off because request paths carry request handles.
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.http-client.enabled=false
quarkus.micrometer.binder.vertx.enabled=false
quarkus.micrometer.binder.netty.enabled=false
quarkus.datasource.metrics.enabled=true

# Tracing (OpenTelemetry, OTLP): off unless QUARKUS_OTEL_SDK_DISABLED=false. Set the collector with
# QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT. Request handles and query strings are scrubbed from spans (SpanScrubber).
quarkus.otel.sdk.disabled=true
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.service.name=eudiw-adapter
# W3C trace context with an oversized tracestate dropped before parsing (GHSA-ccrj-gw8r-854m); see
# BoundedTraceContextPropagator. The disabled SDK keeps these propagators too.
quarkus.otel.propagators=tracecontext-bounded,baggage

# Audit events: one line per event in this category (no claims, tokens or request handles)
quarkus.log.category."eudiw.audit".level=INFO

# Request limits
quarkus.http.limits.max-body-size=2M
quarkus.http.limits.max-form-attribute-size=2M

# Never log request bodies or tokens
quarkus.log.category."io.quarkus.oidc".level=ERROR
# Authentication failures carry the rejected token in exception messages; keep them out of DEBUG logs
quarkus.log.category."io.vertx.ext.web.RoutingContext".level=INFO
quarkus.log.category."io.quarkus.security".level=INFO
quarkus.http.access-log.enabled=false

# Tests write the log to a file so they can assert what never appears in it
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=target/test-service.log
%test.quarkus.log.level=DEBUG
%test.quarkus.log.category."io.github.suengineering".level=DEBUG
%test.quarkus.log.category."org.testcontainers".level=INFO
%test.quarkus.log.category."com.github.dockerjava".level=INFO
%test.quarkus.log.category."org.apache.http".level=INFO
